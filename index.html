    <meta property="og:title" content="NusaHR Enterprise - SaaS HRMS & Workforce Platform" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Baseline CSP (security-hardening-rules.md §5). A meta-tag CSP works
      on any static host with zero platform-specific config, but it's a
      floor, not the final answer — if the hosting platform supports
      response headers (Vercel/Netlify/Cloudflare/nginx), prefer setting
      the same policy there instead (headers also cover frame-ancestors,
      which a meta tag can't enforce). If the API ends up served from a
      different origin than this frontend in production, connect-src below
      needs to list that origin explicitly.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://server.arcgisonline.com; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self';"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
